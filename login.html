                    <h3 class="text-center mb-4">Halaman Login</h3>
                    
                    <!-- Tempat Pesan Validasi -->
                    <div id="pesan"></div>
                    
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email / Nama Pengguna</label>

                        <div class="mb-3">
                            <label for="password" class="form-label">Kata Sandi</label>
                            <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter">
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                </div>
            </div>
